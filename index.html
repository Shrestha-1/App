<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 650px;
        }

        /* Desktop Top Navigation */
        .top-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 30px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                0 0 0 1px rgba(0, 0, 0, 0.02);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            height: 85px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        .top-nav:hover {
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transform: translateY(-2px);
        }

        /* Apple-style icons */
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            background: transparent;
            border: none;
            color: #86868b;
            flex: 1;
            z-index: 2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .icon:hover {
            transform: translateY(-4px);
            color: #1d1d1f;
            background: rgba(0, 0, 0, 0.02);
        }

        .icon:active {
            transform: scale(0.94);
        }

        .icon svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon:hover svg {
            transform: scale(1.08);
        }

        .icon span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            color: inherit;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .icon.active {
            color: #1d1d1f;
        }

        .icon.active svg {
            transform: scale(1.05);
        }

        .icon.active span {
            color: #1d1d1f;
            font-weight: 600;
        }

        /* Apple-style active indicator - small dot */
        .icon.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #007aff;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.3);
        }

        /* Mobile Bottom Navigation - shown when screen < 500px */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 8px 10px 12px;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
        }

        .bottom-nav .icon {
            flex: 1;
            padding: 4px 4px;
            border-radius: 12px;
            min-width: 40px;
        }

        .bottom-nav .icon svg {
            width: 22px;
            height: 22px;
        }

        .bottom-nav .icon span {
            font-size: 8px;
            letter-spacing: 0.2px;
        }

        .bottom-nav .icon.active::after {
            bottom: -1px;
            width: 3px;
            height: 3px;
        }

        /* Show bottom nav on small screens, hide top nav */
        @media (max-width: 500px) {
            .container {
                width: 100%;
                padding-bottom: 80px;
            }

            .top-nav {
                display: none;
            }

            .bottom-nav {
                display: flex;
            }
        }

        /* Tablet responsive */
        @media (max-width: 700px) and (min-width: 501px) {
            .container { width: 95%; }
            
            .top-nav {
                padding: 0 8px;
                height: 72px;
                border-radius: 24px;
            }

            .icon { padding: 5px 6px; }
            .icon svg { width: 20px; height: 20px; }
            .icon span { font-size: 8px; letter-spacing: 0.2px; }
        }

        @media (max-width: 480px) {
            .bottom-nav {
                padding: 6px 6px 10px;
            }
            .bottom-nav .icon svg {
                width: 18px;
                height: 18px;
            }
            .bottom-nav .icon span {
                font-size: 7px;
                letter-spacing: 0.1px;
            }
            .bottom-nav .icon {
                padding: 3px 3px;
                min-width: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Desktop Top Navigation -->
        <div class="top-nav" id="topNav">
            <button class="icon active" data-icon="home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </button>

            <button class="icon" data-icon="categories">
                <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                <span>Categories</span>
            </button>

            <button class="icon" data-icon="add">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>Add</span>
            </button>

            <button class="icon" data-icon="wishlist">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>Wishlist</span>
            </button>

            <button class="icon" data-icon="profile">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </button>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="bottom-nav" id="bottomNav">
        <button class="icon active" data-icon="home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </button>

        <button class="icon" data-icon="categories">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            <span>Categories</span>
        </button>

        <button class="icon" data-icon="add">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Add</span>
        </button>

        <button class="icon" data-icon="wishlist">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Wishlist</span>
        </button>

        <button class="icon" data-icon="profile">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Profile</span>
        </button>
    </div>

    <script>
        // Sync both desktop and mobile icons
        const allIcons = document.querySelectorAll('.icon');

        allIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const iconName = this.dataset.icon;
                
                // Remove active from all icons
                allIcons.forEach(i => i.classList.remove('active'));
                
                // Add active to clicked icon
                this.classList.add('active');
                
                // Sync with other navigation (desktop/mobile)
                allIcons.forEach(i => {
                    if (i.dataset.icon === iconName) {
                        i.classList.add('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
